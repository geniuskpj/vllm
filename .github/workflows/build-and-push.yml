name: Build and Push Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        shell: bash
        run: |
          REPOSITORY_OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="ghcr.io/${REPOSITORY_OWNER}/${GITHUB_REPOSITORY#*/}"

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/tags/* ]]; then
            TAGS="${IMAGE}:${GITHUB_REF_NAME},${IMAGE}:latest"
          else
            TAGS="${IMAGE}:${GITHUB_REF_NAME}"
          fi

          {
            echo "tags=${TAGS}"
            echo "cache_tag=${IMAGE}:buildcache-cuda12"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            UBUNTU_VERSION=22.04
            CUDA_VERSION=12.4.1
          cache-from: type=registry,ref=${{ steps.meta.outputs.cache_tag }}
          cache-to: type=registry,ref=${{ steps.meta.outputs.cache_tag }},mode=max
